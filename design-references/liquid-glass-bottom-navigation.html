<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cam Alt Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506;
  --fg:#ffffff;
  --fg-2:rgba(255,255,255,.62);
  --fg-3:rgba(255,255,255,.35);
  --card:rgba(255,255,255,.065);
  --accent:#ffffff;
  --accent-ink:#0d0d10;
  --tint:rgba(255,255,255,.16);
  --orb-1:rgba(255,255,255,.14);
  --orb-2:rgba(160,162,175,.28);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
[data-theme="ice"]{
  --accent:#bae6fd;
  --accent-ink:#071521;
  --tint:rgba(125,211,252,.18);
  --orb-1:rgba(56,189,248,.24);
  --orb-2:rgba(129,140,248,.24);
}
[data-theme="ruby"]{
  --accent:#fecdd3;
  --accent-ink:#21070c;
  --tint:rgba(251,113,133,.18);
  --orb-1:rgba(244,63,94,.24);
  --orb-2:rgba(251,146,60,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100vh}
body{
  margin:0;
  background:#000;
  color:var(--fg);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.phone{
  position:relative;
  width:min(390px,100%);
  height:min(760px,92dvh);
  min-height:560px;
  overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,#1d1d21 0%,#0b0b0d 55%,#050506 100%);
  isolation:isolate;
}
@media (min-width:500px){
  .phone{
    border-radius:38px;
    box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 80px rgba(0,0,0,.85);
  }
}
.o{
  position:absolute;
  border-radius:50%;
  filter:blur(46px);
  pointer-events:none;
  z-index:-1;
  will-change:transform;
}
.o1{
  width:240px;
  height:240px;
  left:-36px;
  top:290px;
  background:var(--orb-1);
  animation:d1 14s ease-in-out infinite alternate;
}
.o2{
  width:225px;
  height:225px;
  right:-44px;
  top:470px;
  background:var(--orb-2);
  animation:d2 16s ease-in-out infinite alternate;
}
@keyframes d1{to{transform:translate3d(120px,-120px,0)}}
@keyframes d2{to{transform:translate3d(-120px,-155px,0)}}

header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:5;
  padding:20px 18px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(180deg,rgba(5,5,6,.88),rgba(5,5,6,0));
}
.ttl{
  font-size:21px;
  font-weight:600;
  letter-spacing:-.015em;
  line-height:1.15;
}
.themes{
  display:inline-flex;
  gap:4px;
  padding:3px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px rgba(255,255,255,.07);
}
.th-btn{
  border:0;
  background:none;
  color:var(--fg-2);
  font:500 11px var(--font);
  padding:5px 9px;
  border-radius:999px;
  cursor:pointer;
  transition:background .22s ease,color .22s ease;
}
.th-btn.act{
  background:rgba(255,255,255,.16);
  color:#fff;
}

.pages{position:absolute;inset:0;touch-action:pan-y}
.page{
  position:absolute;
  inset:0;
  overflow-y:auto;
  padding:68px 16px 124px;
  scrollbar-width:none;
  will-change:transform,opacity;
}
.page::-webkit-scrollbar{display:none}
.page[hidden]{display:none}

.chips{display:flex;gap:8px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  padding:7px 14px;
  border-radius:999px;
  font-size:12.5px;
  background:var(--card);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  color:var(--fg-2);
  cursor:pointer;
  transition:background .2s ease,color .2s ease;
}
.chip.a{background:var(--accent);color:var(--accent-ink);box-shadow:none;font-weight:500}

.vid{margin:0 0 18px}
.th{
  position:relative;
  aspect-ratio:16/9;
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.025));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07);
}
.th::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:60%;
  left:-70%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);
  transform:skewX(-18deg);
  animation:shn 4.2s ease-in-out infinite;
}
@keyframes shn{0%,42%{left:-70%}100%{left:130%}}
.dur{
  position:absolute;
  right:8px;
  bottom:8px;
  padding:2px 7px;
  border-radius:6px;
  font-size:11.5px;
  font-weight:500;
  background:rgba(0,0,0,.68);
}
.meta{display:flex;gap:12px;margin-top:10px}
.av{
  flex:none;
  width:36px;
  height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
}
.t1{height:12px;width:88%;border-radius:6px;background:rgba(255,255,255,.2);margin-bottom:8px}
.t2{height:10px;width:58%;border-radius:5px;background:rgba(255,255,255,.1)}

.short{
  width:min(220px,64%);
  aspect-ratio:9/16;
  margin:6px auto 0;
  border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.09);
  position:relative;
  overflow:hidden;
}
.short .t1,.short .t2{position:absolute;left:14px;bottom:44px}
.short .t2{bottom:24px}
.short .t1{width:60%}

.avs{display:flex;gap:14px;overflow-x:auto;margin:0 0 20px;scrollbar-width:none}
.avs::-webkit-scrollbar{display:none}
.avs div{flex:none;text-align:center;font-size:11px;color:var(--fg-2)}
.avs span{
  display:block;
  width:56px;
  height:56px;
  border-radius:50%;
  margin:0 auto 6px;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32);
}
.row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  margin:0 0 10px;
  border-radius:18px;
  background:var(--card);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.06);
}
.row .ic{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.09)}
.row .tx{flex:1}

/* Bir tık kısaltılmış ve daha şeffaf sıvı cam alt menü */
nav{
  position:absolute;
  left:50%;
  transform:translate3d(-50%,0,0);
  width:min(334px,calc(100% - 44px));
  bottom:max(14px,env(safe-area-inset-bottom));
  z-index:20;
  height:64px;
  border-radius:32px;
  padding:5px;
  background:rgba(255,255,255,.048);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -10px 18px var(--tint),
    0 16px 34px rgba(0,0,0,.62);
  will-change:transform;
}
nav::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.72),rgba(255,255,255,.04) 38%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.42));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  pointer-events:none;
}
.track{position:relative;height:100%}
.ind{
  position:absolute;
  top:0;
  bottom:0;
  width:calc(20% - 4px);
  left:calc(var(--s,0) * 20% + 2px);
  border-radius:27px;
  background:rgba(255,255,255,.11);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.48),
    inset 0 -8px 14px var(--tint),
    0 6px 14px rgba(0,0,0,.32);
  transition:left .48s cubic-bezier(.34,1.45,.5,1),background .25s ease;
  pointer-events:none;
  will-change:left,transform;
}
.ind::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 58%);
}
.items{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.it{
  position:relative;
  border:0;
  background:none;
  color:var(--fg-2);
  font:500 10px var(--font);
  letter-spacing:-.01em;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:0;
  cursor:pointer;
  transition:color .22s ease,transform .16s ease;
  will-change:transform;
}
.it:active{transform:scale(.92)}
.it:focus-visible{
  outline:2px solid rgba(255,255,255,.75);
  outline-offset:-3px;
  border-radius:27px;
}
.it svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  overflow:visible;
  will-change:transform;
}
.it .f{fill:transparent;transition:fill .22s ease}
.it .g{fill:currentColor;stroke:none;transition:fill .22s ease}
.it.on{color:var(--accent)}
.it.on .f{fill:var(--accent)}
.it.on .g{fill:var(--accent-ink)}

.plus{position:relative}
.plus .pb{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.88);
  color:#0a0a0b;
  box-shadow:inset 0 1px 0 #fff,0 8px 18px rgba(0,0,0,.48);
  transition:transform .38s cubic-bezier(.34,1.5,.5,1),background .25s ease;
  will-change:transform;
}
.plus svg{width:22px;height:22px;stroke:#0a0a0b;stroke-width:2.3}
.plus.open .pb{
  transform:rotate(135deg);
  background:rgba(255,255,255,.16);
  color:#fff;
}
.plus.open svg{stroke:#fff}

.sheet{
  position:absolute;
  left:28px;
  right:28px;
  bottom:90px;
  z-index:30;
  padding:8px;
  border-radius:24px;
  background:rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(22px) saturate(155%);
  backdrop-filter:blur(22px) saturate(155%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 22px 46px rgba(0,0,0,.68);
  opacity:0;
  transform:translate3d(0,18px,0) scale(.94);
  transform-origin:50% 100%;
  pointer-events:none;
  transition:opacity .22s ease,transform .38s cubic-bezier(.34,1.45,.5,1);
  will-change:transform,opacity;
}
.sheet.open{
  opacity:1;
  transform:translate3d(0,0,0) scale(1);
  pointer-events:auto;
}
.sheet::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.68),rgba(255,255,255,.04) 40%,rgba(255,255,255,.04) 60%,rgba(255,255,255,.38));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  pointer-events:none;
}
.sheet button{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  padding:13px 15px;
  border:0;
  border-radius:17px;
  background:none;
  color:#fff;
  font:500 14.5px var(--font);
  text-align:left;
  cursor:pointer;
  transition:background .18s ease;
}
.sheet button:hover,.sheet button:active{background:rgba(255,255,255,.1)}
.sheet svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:var(--accent);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.scrim{
  position:absolute;
  inset:0;
  z-index:25;
  background:rgba(0,0,0,.32);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.scrim.open{opacity:1;pointer-events:auto}

.toast{
  position:absolute;
  top:18px;
  left:50%;
  z-index:40;
  padding:10px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:500;
  background:rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 10px 24px rgba(0,0,0,.6);
  transform:translate3d(-50%,-80px,0);
  opacity:0;
  transition:transform .42s cubic-bezier(.34,1.5,.5,1),opacity .25s ease;
  white-space:nowrap;
  will-change:transform,opacity;
}
.toast.show{transform:translate3d(-50%,0,0);opacity:1}

@media (prefers-reduced-motion:reduce){
  .o,.th::after{animation:none}
  .ind,.sheet,.toast,.plus .pb,.page{transition:none}
}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="o o1"></div>
  <div class="o o2"></div>

  <header>
    <div class="ttl" id="ttl">Ana sayfa</div>
    <div class="themes" role="group" aria-label="Cam tonu">
      <button type="button" class="th-btn act" data-theme="obsidian">Cam</button>
      <button type="button" class="th-btn" data-theme="ice">Buzul</button>
      <button type="button" class="th-btn" data-theme="ruby">Yakut</button>
    </div>
  </header>

  <div class="toast" id="toast" role="status"></div>

  <div class="pages" id="pages">
    <section class="page" id="p0">
      <div class="chips">
        <span class="chip a">Tümü</span>
        <span class="chip">Müzik</span>
        <span class="chip">Oyun</span>
        <span class="chip">Canlı</span>
        <span class="chip">Yeni</span>
      </div>
      <div class="vid"><div class="th"><span class="dur">12:08</span></div><div class="meta"><div class="av"></div><div style="flex:1"><div class="t1"></div><div class="t2"></div></div></div></div>
      <div class="vid"><div class="th"><span class="dur">4:31</span></div><div class="meta"><div class="av"></div><div style="flex:1"><div class="t1"></div><div class="t2"></div></div></div></div>
      <div class="vid"><div class="th"><span class="dur">26:40</span></div><div class="meta"><div class="av"></div><div style="flex:1"><div class="t1"></div><div class="t2"></div></div></div></div>
    </section>

    <section class="page" id="p1" hidden>
      <div class="short"><div class="t1"></div><div class="t2"></div></div>
    </section>

    <section class="page" id="p2" hidden>
      <div class="avs">
        <div><span></span>Kanal 1</div>
        <div><span></span>Kanal 2</div>
        <div><span></span>Kanal 3</div>
        <div><span></span>Kanal 4</div>
        <div><span></span>Kanal 5</div>
      </div>
      <div class="vid"><div class="th"><span class="dur">8:15</span></div><div class="meta"><div class="av"></div><div style="flex:1"><div class="t1"></div><div class="t2"></div></div></div></div>
      <div class="vid"><div class="th"><span class="dur">3:02</span></div><div class="meta"><div class="av"></div><div style="flex:1"><div class="t1"></div><div class="t2"></div></div></div></div>
    </section>

    <section class="page" id="p3" hidden>
      <div class="row"><div class="ic"></div><div class="tx"><div class="t1"></div><div class="t2"></div></div></div>
      <div class="row"><div class="ic"></div><div class="tx"><div class="t1"></div><div class="t2"></div></div></div>
      <div class="row"><div class="ic"></div><div class="tx"><div class="t1"></div><div class="t2"></div></div></div>
      <div class="row"><div class="ic"></div><div class="tx"><div class="t1"></div><div class="t2"></div></div></div>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet" role="menu" aria-label="Oluştur">
    <button type="button" role="menuitem" data-m="Video yükle">
      <svg viewBox="0 0 24 24"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 19h14"/></svg>
      <span>Video yükle</span>
    </button>
    <button type="button" role="menuitem" data-m="Kısa video oluştur">
      <svg viewBox="0 0 24 24"><rect x="6.5" y="3.5" width="11" height="17" rx="3.2"/><path d="M10.8 9.8 14.5 12l-3.7 2.2z"/></svg>
      <span>Kısa video oluştur</span>
    </button>
    <button type="button" role="menuitem" data-m="Canlı yayın başlat">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M8 8a5.6 5.6 0 0 0 0 8M16 8a5.6 5.6 0 0 1 0 8"/></svg>
      <span>Canlı yayın başlat</span>
    </button>
  </div>

  <nav id="nav" aria-label="Ana menü">
    <div class="track">
      <div class="ind" id="ind" style="--s:0"></div>
      <div class="items">
        <button type="button" class="it on" data-t="0" data-s="0" aria-current="page">
          <svg viewBox="0 0 24 24">
            <path class="f" d="M4.5 11.2 12 4.8l7.5 6.4v7.3a1.5 1.5 0 0 1-1.5 1.5h-3.5v-5.2a2.5 2.5 0 0 0-5 0V20H6a1.5 1.5 0 0 1-1.5-1.5z"/>
          </svg>
          <span>Ana sayfa</span>
        </button>

        <button type="button" class="it" data-t="1" data-s="1">
          <svg viewBox="0 0 24 24">
            <rect class="f" x="6.5" y="3.5" width="11" height="17" rx="3.2"/>
            <path class="g" d="M10.8 9.8 14.5 12l-3.7 2.2z"/>
          </svg>
          <span>Shorts</span>
        </button>

        <button type="button" class="it plus" id="plus" aria-haspopup="menu" aria-expanded="false" aria-label="Oluştur">
          <span class="pb"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
        </button>

        <button type="button" class="it" data-t="2" data-s="3">
          <svg viewBox="0 0 24 24">
            <rect class="f" x="3.5" y="8.5" width="17" height="11" rx="2.8"/>
            <path d="M7.5 5h9"/>
            <path class="g" d="M10.8 11.8 14.5 14l-3.7 2.2z"/>
          </svg>
          <span>Abonelikler</span>
        </button>

        <button type="button" class="it" data-t="3" data-s="4">
          <svg viewBox="0 0 24 24">
            <circle class="f" cx="12" cy="8.5" r="3.4"/>
            <path class="f" d="M5.5 19.5a6.5 6.5 0 0 1 13 0z"/>
          </svg>
          <span>Sen</span>
        </button>
      </div>
    </div>
  </nav>
</div>

<script>
(function(){
  const titles=['Ana sayfa','Shorts','Abonelikler','Sen'];
  const tabs=Array.from(document.querySelectorAll('.it[data-t]'));
  const pages=[0,1,2,3].map((i)=>document.getElementById('p'+i));
  const pagesWrap=document.getElementById('pages');
  const ind=document.getElementById('ind');
  const ttl=document.getElementById('ttl');
  const plus=document.getElementById('plus');
  const sheet=document.getElementById('sheet');
  const scrim=document.getElementById('scrim');
  const toast=document.getElementById('toast');
  const themeBtns=Array.from(document.querySelectorAll('.th-btn'));
  const chips=Array.from(document.querySelectorAll('.chip'));

  let cur=0;
  let toastTimer=null;
  let titleTimer=null;

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),1750);
  }

  function go(i){
    if(i===cur || i<0 || i>=tabs.length)return;
    const dir=i>cur?1:-1;
    const from=pages[cur];
    const to=pages[i];
    const slot=tabs[i].dataset.s;

    tabs[cur].classList.remove('on');
    tabs[cur].removeAttribute('aria-current');
    tabs[i].classList.add('on');
    tabs[i].setAttribute('aria-current','page');

    ind.style.setProperty('--s',slot);
    ind.animate(
      [
        {transform:'translate3d(0,0,0) scale(1,1)'},
        {transform:'translate3d(0,0,0) scale(1.38,.9)',offset:.42},
        {transform:'translate3d(0,0,0) scale(1,1)'}
      ],
      {duration:460,easing:'ease-out'}
    );

    const svg=tabs[i].querySelector('svg');
    if(svg){
      svg.animate(
        [
          {transform:'translate3d(0,0,0) scale(1)'},
          {transform:'translate3d(0,0,0) scale(.78)',offset:.25},
          {transform:'translate3d(0,0,0) scale(1.16)',offset:.62},
          {transform:'translate3d(0,0,0) scale(1)'}
        ],
        {duration:420,easing:'ease-out'}
      );
    }

    clearTimeout(titleTimer);
    ttl.animate(
      [
        {opacity:1,transform:'translate3d(0,0,0)'},
        {opacity:0,transform:'translate3d(0,-5px,0)',offset:.4},
        {opacity:0,transform:'translate3d(0,5px,0)',offset:.41},
        {opacity:1,transform:'translate3d(0,0,0)'}
      ],
      {duration:320,easing:'ease-out'}
    );
    titleTimer=setTimeout(()=>{ttl.textContent=titles[i];},130);

    to.hidden=false;
    to.scrollTop=0;

    const outAnim=from.animate(
      [
        {opacity:1,transform:'translate3d(0,0,0)'},
        {opacity:0,transform:'translate3d('+(-dir*36)+'px,0,0)'}
      ],
      {duration:240,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'}
    );

    to.animate(
      [
        {opacity:0,transform:'translate3d('+(dir*36)+'px,0,0)'},
        {opacity:1,transform:'translate3d(0,0,0)'}
      ],
      {duration:320,easing:'cubic-bezier(.2,.75,.3,1)'}
    );

    outAnim.onfinish=()=>{
      from.hidden=true;
      outAnim.cancel();
    };

    cur=i;
  }

  tabs.forEach((btn,idx)=>{
    btn.addEventListener('click',()=>{
      closeSheet();
      go(idx);
    });
  });

  function openSheet(){
    plus.classList.add('open');
    sheet.classList.add('open');
    scrim.classList.add('open');
    plus.setAttribute('aria-expanded','true');
  }

  function closeSheet(){
    plus.classList.remove('open');
    sheet.classList.remove('open');
    scrim.classList.remove('open');
    plus.setAttribute('aria-expanded','false');
  }

  plus.addEventListener('click',(e)=>{
    e.stopPropagation();
    sheet.classList.contains('open')?closeSheet():openSheet();
  });

  scrim.addEventListener('click',closeSheet);

  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape')closeSheet();
  });

  Array.from(sheet.querySelectorAll('button')).forEach((btn)=>{
    btn.addEventListener('click',()=>{
      closeSheet();
      showToast(btn.dataset.m);
    });
  });

  themeBtns.forEach((btn)=>{
    btn.addEventListener('click',()=>{
      themeBtns.forEach((b)=>b.classList.remove('act'));
      btn.classList.add('act');
      const th=btn.dataset.theme;
      if(th==='obsidian'){
        document.documentElement.removeAttribute('data-theme');
      }else{
        document.documentElement.setAttribute('data-theme',th);
      }
    });
  });

  chips.forEach((chip)=>{
    chip.addEventListener('click',()=>{
      chips.forEach((c)=>c.classList.remove('a'));
      chip.classList.add('a');
    });
  });

  let startX=0,startY=0;
  pagesWrap.addEventListener('touchstart',(e)=>{
    if(!e.touches || !e.touches[0])return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
  },{passive:true});

  pagesWrap.addEventListener('touchend',(e)=>{
    if(sheet.classList.contains('open') || !e.changedTouches || !e.changedTouches[0])return;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>52 && Math.abs(dx)>Math.abs(dy)*1.35){
      if(dx<0 && cur<tabs.length-1)go(cur+1);
      else if(dx>0 && cur>0)go(cur-1);
    }
  },{passive:true});
})();
</script>
</body>
</html>
