name: Build VYRA patch bundle

on:
  push:
    branches: [main]
    paths-ignore: ['patches-bundle.json', 'build-status.json']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install splash asset generator dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check out pinned Morphe Patches source
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: 31234a8465683a389bcfba25ad636fd1cd38fd02
          path: morphe-patches
      - name: Check out VYRA source
        uses: actions/checkout@v4
        with:
          path: vyra-youtube
      - name: Apply and validate VYRA overlay
        working-directory: morphe-patches
        run: |
          python3 -m py_compile ../vyra-youtube/patches/apply_vyra_youtube_overlay.py ../vyra-youtube/patches/generate_vyra_splash.py
          python3 ../vyra-youtube/patches/apply_vyra_youtube_overlay.py
          python3 -m json.tool patches/src/main/resources/custom-branding/raw/vyra_startup_animation.json >/dev/null
          grep -q 'VYRA Liquid Glass Splash' patches/src/main/resources/custom-branding/raw/vyra_startup_animation.json
          git diff --check
          grep -q 'SwitchPreference("morphe_navigation_bar_glass"' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'morphe_navigation_bar_animations", TRUE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'morphe_navigation_bar_glass_opacity", 14' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'morphe_navigation_bar_glass_round", TRUE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'morphe_navigation_bar_glass", TRUE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'Settings.VYRA_GLASS_MODE.get()' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/YouTubeGlassNavigationBar.java
          grep -q 'vyra_glass_mode' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'NavigationBarStyle.DEFAULT' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'VYRA_SPLASH_SCREEN' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'VYRA_GLASS_MODE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'styleVYRAPlayerControl' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/LegacyPlayerControlsPatch.java
          grep -q 'styleVYRAShortsBottomBar' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/NavigationBarPatch.java
          grep -q 'styleVYRAShortsBottomBar' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'toolbarGlass' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/WideSearchBarPatch.java
          grep -q 'initializeTopControl(EXTENSION_ADD_ON_API_CLASS_DESCRIPTOR)' patches/src/main/kotlin/app/morphe/patches/youtube/misc/playercontrols/LegacyPlayerControlsPatch.kt
          grep -q 'vyra_startup_animation.json' patches/src/main/kotlin/app/morphe/patches/shared/layout/branding/StartupAnimationResourcePatch.kt
          grep -q 'vyra_startup_animation' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/theme/ThemePatch.java
          grep -q 'SwitchPreference("vyra_splash_screen"' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'titleKey = "vyra_appearance_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'titleKey = "vyra_player_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'titleKey = "vyra_feed_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'titleKey = "vyra_shorts_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'ListPreference("morphe_navigation_bar_style")' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'SwitchPreference("morphe_navigation_bar_glass"' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'titleKey = "vyra_settings_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'splashAnimationPatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/branding/CustomBrandingPatch.kt
          grep -q 'splashAnimationPatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/seekbar/SeekbarColorPatch.kt
          grep -q 'startupAnimationResourcePatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/theme/SplashAnimationPatch.kt
          ! grep -q 'glowMorpheAnimationResourcePatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/theme/SplashAnimationPatch.kt
          test -f patches/src/main/resources/custom-branding/raw/morphe_startup_animation_play.json
          grep -q 'name = "VYRA YouTube Patches"' patches/build.gradle.kts
          if git diff --quiet; then echo 'No VYRA source changes detected'; exit 1; fi

  build-mpp:
    needs: validate-overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install splash asset generator dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: 31234a8465683a389bcfba25ad636fd1cd38fd02
          path: morphe-patches
      - uses: actions/checkout@v4
        with:
          path: vyra-youtube
      - name: Ensure Maven Central is available for upstream plugin dependencies
        working-directory: morphe-patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          s = p.read_text()
          marker = '        google()\n'
          assert s.count(marker) == 1, 'unexpected pluginManagement repository block'
          additions = ''
          if 'maven-central.storage-download.googleapis.com' not in s:
              additions += '        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n'
          if 'https://repo1.maven.org/maven2' not in s:
              additions += '        maven { url = uri("https://repo1.maven.org/maven2") }\n'
          if 'mavenCentral()' not in s:
              additions += '        mavenCentral()\n'
          if additions:
              p.write_text(s.replace(marker, marker + additions, 1))
          PY
      - name: Apply VYRA overlay
        working-directory: morphe-patches
        run: python3 ../vyra-youtube/patches/apply_vyra_youtube_overlay.py
      - name: Build Android patch bundle
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_gpr_user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr_key: ${{ secrets.MORPHE_GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then echo 'Add MORPHE_GITHUB_TOKEN (read:packages) in repository Actions secrets'; exit 1; fi
          chmod +x ./gradlew
          ./gradlew --no-daemon :patches:buildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-youtube-patch-bundle
          path: morphe-patches/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14



  publish-status:
    needs: [validate-overlay, build-mpp]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}
      - name: Publish final build status
        env:
          VALIDATION_RESULT: ${{ needs.validate-overlay.result }}
          BUILD_RESULT: ${{ needs.build-mpp.result }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VALIDATION_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ]; then RESULT=success; else RESULT=failure; fi
          printf '{"run_id":%s,"status":"%s","validation":"%s","build":"%s","url":"%s","commit":"%s"}\n' "$BUILD_RUN_ID" "$RESULT" "$VALIDATION_RESULT" "$BUILD_RESULT" "$BUILD_RUN_URL" "$GITHUB_SHA" > build-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add build-status.json
          git commit -m "Record VYRA patch build status [skip ci]" || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
