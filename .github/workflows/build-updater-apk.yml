name: Build VYRA Updater APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-updater-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Decode signing keystore
        env:
          VYRA_KEYSTORE_BASE64: ${{ secrets.VYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VYRA_KEYSTORE_BASE64" ]; then
            echo "Signing secrets are not configured yet; building debug APK only."
            echo "VYRA_SIGNING_READY=false" >> "$GITHUB_ENV"
          else
            echo "$VYRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vyra-release.jks"
            echo "VYRA_KEYSTORE_FILE=$RUNNER_TEMP/vyra-release.jks" >> "$GITHUB_ENV"
            echo "VYRA_SIGNING_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Build updater APK
        env:
          VYRA_KEYSTORE_PASSWORD: ${{ secrets.VYRA_KEYSTORE_PASSWORD }}
          VYRA_KEY_ALIAS: ${{ secrets.VYRA_KEY_ALIAS }}
          VYRA_KEY_PASSWORD: ${{ secrets.VYRA_KEY_PASSWORD }}
        run: |
          gradle --version
          if [ "$VYRA_SIGNING_READY" = "true" ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VYRA_SIGNING_READY == 'true' && 'vyra-updater-release-apk' || 'vyra-updater-debug-apk' }}
          path: ${{ env.VYRA_SIGNING_READY == 'true' && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}
          if-no-files-found: error
          retention-days: 14
