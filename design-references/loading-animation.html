<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cam Dalga Yükleme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506;
  --fg:#ffffff;
  --fg-2:rgba(255,255,255,.6);
  --fg-3:rgba(255,255,255,.35);
  --glass:rgba(255,255,255,.06);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
.stage{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px;overflow:hidden;isolation:isolate;background:radial-gradient(110% 80% at 50% 0%,#1d1d21 0%,#0b0b0d 55%,#000 100%)}
.o{position:absolute;border-radius:50%;filter:blur(44px);pointer-events:none;z-index:-1}
.o1{width:260px;height:260px;left:8%;top:22%;background:rgba(255,255,255,.14);animation:d1 12s ease-in-out infinite alternate}
.o2{width:240px;height:240px;right:6%;top:46%;background:rgba(150,150,158,.3);animation:d2 14s ease-in-out infinite alternate}
.o3{width:180px;height:180px;left:44%;bottom:6%;background:rgba(210,210,215,.12);animation:d3 16s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,30px)}}
@keyframes d2{to{transform:translate(-130px,-40px)}}
@keyframes d3{to{transform:translate(-90px,-50px)}}
.grain{position:absolute;inset:0;z-index:-1;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.card{display:flex;flex-direction:column;align-items:center;gap:14px}
.orb{position:relative;width:min(300px,78vw);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.045);-webkit-backdrop-filter:blur(22px) saturate(130%);backdrop-filter:blur(22px) saturate(130%);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -26px 40px rgba(255,255,255,.04),0 30px 60px rgba(0,0,0,.75);transition:transform .25s ease-out;will-change:transform}
.orb::before{content:"";position:absolute;left:14%;top:6%;width:56%;height:34%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),rgba(255,255,255,0));transform:rotate(-24deg);pointer-events:none}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,255,255,.05) 36%,rgba(255,255,255,.05) 64%,rgba(255,255,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.orb svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tk{stroke:#fff;stroke-width:1.4;stroke-linecap:round;opacity:.14;transition:opacity .25s ease}
.tk.on{opacity:.8}
.tr{fill:none;stroke:rgba(255,255,255,.09);stroke-width:3.5}
.core{fill:none;stroke:#fff;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.glow{fill:none;stroke:rgba(255,255,255,.32);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.bead{fill:#fff}
.ctr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.num{display:flex;align-items:flex-start;font-size:clamp(48px,15vw,64px);font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;transition:opacity .3s ease,transform .4s ease}
.num small{font-size:.36em;font-weight:400;color:var(--fg-2);margin:.28em 0 0 .12em}
.ck{position:absolute;width:34%;height:34%;overflow:visible}
.cp{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;transition:stroke-dashoffset .5s ease .1s}
.orb.done .num{opacity:0;transform:scale(.8)}
.orb.done .cp{stroke-dashoffset:0}
.st{margin:6px 0 0;font-size:15px;font-weight:500;letter-spacing:.01em}
.mb{margin:0;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.re{position:relative;margin-top:10px;height:44px;padding:0 22px;border:0;border-radius:22px;overflow:hidden;color:#fff;font:500 14px var(--font);cursor:pointer;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px rgba(0,0,0,.6);transition:background .3s ease,opacity .3s ease}
.re::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,.05) 40%,rgba(255,255,255,.05) 60%,rgba(255,255,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.re:hover{background:rgba(255,255,255,.14)}
.re:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:3px}
.re[disabled]{opacity:.4;cursor:default}
.rpl{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:rgba(255,255,255,.4);pointer-events:none}
.sp{position:absolute;border-radius:50%;background:#fff;pointer-events:none}
.wave{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.7);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.o{animation:none}.orb{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="o o1"></div><div class="o o2"></div><div class="o o3"></div>
  <div class="grain"></div>
  <section class="card">
    <div class="orb" id="orb" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="İndirme ilerlemesi">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
        <g id="ticks"></g>
        <circle class="tr" cx="100" cy="100" r="84"/>
        <path class="glow" id="glow" d="" filter="url(#bl)"/>
        <path class="core" id="core" d=""/>
        <circle class="bead" id="halo" r="9" opacity="0" filter="url(#bl)"/>
        <circle class="bead" id="bead" r="4.6" opacity="0"/>
      </svg>
      <div class="ctr">
        <div class="num"><span id="n">0</span><small>%</small></div>
        <svg class="ck" viewBox="0 0 40 40" aria-hidden="true"><path class="cp" d="M8 21 L17 30 L33 11"/></svg>
      </div>
    </div>
    <p class="st" id="st">Bağlanıyor…</p>
    <p class="mb" id="mb">0,0 / 48 MB</p>
    <button class="re" id="re" disabled>Tekrar oynat</button>
  </section>
</main>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var orb=document.getElementById('orb'),core=document.getElementById('core'),glow=document.getElementById('glow'),
      bead=document.getElementById('bead'),halo=document.getElementById('halo'),nEl=document.getElementById('n'),
      st=document.getElementById('st'),mb=document.getElementById('mb'),re=document.getElementById('re'),
      stage=document.getElementById('stage'),ticksG=document.getElementById('ticks');
  var TOTAL=48,R=84,TICKS=60,ticks=[],running=false;

  for(var i=0;i<TICKS;i++){
    var a=i/TICKS*Math.PI*2-Math.PI/2,l=document.createElementNS(NS,'line');
    l.setAttribute('class','tk');
    l.setAttribute('x1',(100+Math.cos(a)*94).toFixed(2));l.setAttribute('y1',(100+Math.sin(a)*94).toFixed(2));
    l.setAttribute('x2',(100+Math.cos(a)*(i%5?97:99)).toFixed(2));l.setAttribute('y2',(100+Math.sin(a)*(i%5?97:99)).toFixed(2));
    ticksG.appendChild(l);ticks.push(l);
  }

  function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}

  function draw(p,t,af){
    if(p<=0.002){core.setAttribute('d','');glow.setAttribute('d','');bead.setAttribute('opacity','0');halo.setAttribute('opacity','0');return}
    var amp=3.2*Math.min(1,p*6)*af,ph=-t*0.006,k=8,n=Math.max(3,Math.round(p*220)),d='',x=100,y=16;
    for(var i=0;i<=n;i++){
      var th=i/n*p*Math.PI*2,r=R+amp*Math.sin(k*th+ph),a=th-Math.PI/2;
      x=100+r*Math.cos(a);y=100+r*Math.sin(a);
      d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);
    }
    core.setAttribute('d',d);glow.setAttribute('d',d);
    bead.setAttribute('cx',x.toFixed(2));bead.setAttribute('cy',y.toFixed(2));bead.setAttribute('opacity',af>0?'1':'0');
    halo.setAttribute('cx',x.toFixed(2));halo.setAttribute('cy',y.toFixed(2));halo.setAttribute('opacity',af>0?'.8':'0');
    var on=Math.floor(p*TICKS+0.0001);
    for(var j=0;j<TICKS;j++){ticks[j].classList.toggle('on',j<on)}
  }

  function sparks(host,count,rad,cx,cy){
    for(var i=0;i<count;i++){
      var d=document.createElement('div');d.className='sp';var sz=3+Math.random()*4;
      d.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+cx+'px;top:'+cy+'px;margin:'+(-sz/2)+'px;opacity:0';
      host.appendChild(d);
      var a=i/count*Math.PI*2+Math.random()*.2,r=rad+Math.random()*30;
      var an=d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+Math.sin(a)*r+'px) scale(0)',opacity:0}],{duration:800+Math.random()*250,easing:'cubic-bezier(.2,.7,.3,1)'});
      an.onfinish=(function(e){return function(){e.remove()}})(d);
    }
  }

  function celebrate(){
    var w=document.createElement('div');w.className='wave';orb.appendChild(w);
    var an=w.animate([{transform:'scale(1)',opacity:.8},{transform:'scale(1.35)',opacity:0}],{duration:900,easing:'ease-out'});
    an.onfinish=function(){w.remove()};
    var r=orb.getBoundingClientRect();
    sparks(orb,22,r.width*.62,r.width/2,r.height/2);
    orb.animate([{transform:'scale(1)'},{transform:'scale(1.05)',offset:.4},{transform:'scale(1)'}],{duration:500,easing:'ease-out'});
  }

  function run(){
    if(running)return;running=true;
    re.disabled=true;orb.classList.remove('done');
    draw(0,0,1);nEl.textContent='0';mb.textContent='0,0 / '+TOTAL.toString().replace('.',',')+' MB';
    for(var j=0;j<TICKS;j++)ticks[j].classList.remove('on');
    st.textContent='Bağlanıyor…';
    setTimeout(function(){
      st.textContent='İndiriliyor';
      var t0=performance.now(),T=5400;
      function tick(now){
        var x=Math.min((now-t0)/T,1),p=ease(x);
        draw(p,now,1);
        var pct=Math.round(p*100);nEl.textContent=pct;orb.setAttribute('aria-valuenow',pct);
        mb.textContent=(p*TOTAL).toFixed(1).replace('.',',')+' / '+TOTAL+' MB';
        if(x<1){requestAnimationFrame(tick)}else{settle(now)}
      }
      requestAnimationFrame(tick);
    },600);
  }

  function settle(t){
    var s0=performance.now(),S=500;
    function tick(now){
      var x=Math.min((now-s0)/S,1),af=1-ease(x);
      draw(1,now,af);
      if(x<1){requestAnimationFrame(tick)}
      else{
        draw(1,now,0);
        orb.classList.add('done');st.textContent='Tamamlandı';celebrate();
        setTimeout(function(){running=false;re.disabled=false},700);
      }
    }
    requestAnimationFrame(tick);
  }

  re.addEventListener('click',function(e){
    var r=re.getBoundingClientRect();
    var cx=e.clientX?e.clientX-r.left:r.width/2,cy=e.clientY?e.clientY-r.top:r.height/2;
    var rp=document.createElement('span');rp.className='rpl';rp.style.left=cx+'px';rp.style.top=cy+'px';re.appendChild(rp);
    var an=rp.animate([{transform:'scale(1)',opacity:.7},{transform:'scale(22)',opacity:0}],{duration:650,easing:'cubic-bezier(.2,.6,.3,1)'});
    an.onfinish=function(){rp.remove()};
    re.animate([{transform:'scale(1)'},{transform:'scale(.92)',offset:.25},{transform:'scale(1.05)',offset:.6},{transform:'scale(1)'}],{duration:480,easing:'ease-out'});
    run();
  });

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    stage.addEventListener('pointermove',function(e){
      var r=orb.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/window.innerWidth,dy=(e.clientY-(r.top+r.height/2))/window.innerHeight;
      orb.style.transform='perspective(800px) rotateY('+(dx*14).toFixed(2)+'deg) rotateX('+(-dy*14).toFixed(2)+'deg)';
    });
    stage.addEventListener('pointerleave',function(){orb.style.transform=''});
  }

  run();
})();
</script>
</body>
</html>
