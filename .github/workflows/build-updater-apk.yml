name: Build VYRA Updater APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-updater-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses && sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug updater APK
        run: |
          gradle --version
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-updater-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
