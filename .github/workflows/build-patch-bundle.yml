name: Build VYRA patch bundle

on:
  push:
    branches: [main, vyra-apk-build-verification, vyra-apk-final-build]
    paths-ignore: ['patches-bundle.json', 'build-status.json', 'updater/update-manifest.json', 'updater/update-status.json']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install splash asset generator dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check out pinned Morphe Patches source
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: 31234a8465683a389bcfba25ad636fd1cd38fd02
          path: morphe-patches
      - name: Check out VYRA source
        uses: actions/checkout@v4
        with:
          path: vyra-youtube
      - name: Apply and validate VYRA overlay
        working-directory: morphe-patches
        env:
          VYRA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 -m py_compile ../vyra-youtube/patches/apply_vyra_youtube_overlay.py ../vyra-youtube/patches/generate_vyra_splash.py
          python3 ../vyra-youtube/patches/apply_vyra_youtube_overlay.py
          python3 -m json.tool patches/src/main/resources/custom-branding/raw/vyra_startup_animation.json >/dev/null
          grep -q 'VYRA Liquid Glass Splash' patches/src/main/resources/custom-branding/raw/vyra_startup_animation.json
          git diff --check
          grep -q 'SwitchPreference("morphe_navigation_bar_glass"' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'morphe_navigation_bar_animations", TRUE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'morphe_navigation_bar_glass_opacity", 14' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'morphe_navigation_bar_glass_round", TRUE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'morphe_navigation_bar_glass", TRUE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'Settings.VYRA_GLASS_MODE.get()' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/YouTubeGlassNavigationBar.java
          grep -q 'vyra_glass_mode' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'NavigationBarStyle.DEFAULT' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'VYRA_SPLASH_SCREEN' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'VYRA_GLASS_MODE' extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
          grep -q 'styleVYRAPlayerControl' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/LegacyPlayerControlsPatch.java
          grep -q 'styleVYRAShortsBottomBar' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/NavigationBarPatch.java
          grep -q 'styleVYRAShortsBottomBar' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'toolbarGlass' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/WideSearchBarPatch.java
          grep -q 'initializeTopControl(EXTENSION_ADD_ON_API_CLASS_DESCRIPTOR)' patches/src/main/kotlin/app/morphe/patches/youtube/misc/playercontrols/LegacyPlayerControlsPatch.kt
          grep -q 'vyra_startup_animation.json' patches/src/main/kotlin/app/morphe/patches/shared/layout/branding/StartupAnimationResourcePatch.kt
          grep -q 'vyra_startup_animation' extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/theme/ThemePatch.java
          grep -q 'SwitchPreference("vyra_splash_screen"' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'titleKey = "vyra_appearance_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'titleKey = "vyra_player_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'titleKey = "vyra_feed_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'titleKey = "vyra_shorts_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'ListPreference("morphe_navigation_bar_style")' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'SwitchPreference("morphe_navigation_bar_glass"' patches/src/main/kotlin/app/morphe/patches/youtube/layout/buttons/navigation/NavigationBarPatch.kt
          grep -q 'titleKey = "vyra_settings_title"' patches/src/main/kotlin/app/morphe/patches/youtube/misc/settings/SettingsPatch.kt
          grep -q 'splashAnimationPatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/branding/CustomBrandingPatch.kt
          grep -q 'splashAnimationPatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/seekbar/SeekbarColorPatch.kt
          grep -q 'startupAnimationResourcePatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/theme/SplashAnimationPatch.kt
          ! grep -q 'glowMorpheAnimationResourcePatch' patches/src/main/kotlin/app/morphe/patches/youtube/layout/theme/SplashAnimationPatch.kt
          test -f patches/src/main/resources/custom-branding/raw/morphe_startup_animation_play.json
          grep -q 'name = "VYRA YouTube Patches"' patches/build.gradle.kts
          if git diff --quiet; then echo 'No VYRA source changes detected'; exit 1; fi

  build-mpp:
    needs: validate-overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install splash asset generator dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: 31234a8465683a389bcfba25ad636fd1cd38fd02
          path: morphe-patches
      - uses: actions/checkout@v4
        with:
          path: vyra-youtube
      - name: Ensure Maven Central is available for upstream plugin dependencies
        working-directory: morphe-patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          s = p.read_text()
          marker = '        google()\n'
          assert s.count(marker) == 1, 'unexpected pluginManagement repository block'
          additions = ''
          if 'maven-central.storage-download.googleapis.com' not in s:
              additions += '        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n'
          if 'https://repo1.maven.org/maven2' not in s:
              additions += '        maven { url = uri("https://repo1.maven.org/maven2") }\n'
          if 'mavenCentral()' not in s:
              additions += '        mavenCentral()\n'
          if additions:
              p.write_text(s.replace(marker, marker + additions, 1))
          PY
      - name: Apply VYRA overlay
        working-directory: morphe-patches
        env:
          VYRA_BUILD_NUMBER: ${{ github.run_number }}
        run: python3 ../vyra-youtube/patches/apply_vyra_youtube_overlay.py
      - name: Build Android patch bundle
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_gpr_user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr_key: ${{ secrets.MORPHE_GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then echo 'Add MORPHE_GITHUB_TOKEN (read:packages) in repository Actions secrets'; exit 1; fi
          chmod +x ./gradlew
          ./gradlew --no-daemon :patches:buildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-youtube-patch-bundle
          path: morphe-patches/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14



  build-apk:
    needs: [validate-overlay, build-mpp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: vyra-youtube-patch-bundle
          path: dist/patches
      - uses: actions/checkout@v4
        with:
          path: vyra-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install VYRA icon conversion dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and verify stock YouTube 21.30.216
        run: |
          curl -fL --connect-timeout 20 --max-time 360 --retry 3 --retry-delay 2 \
            "https://archive.org/download/jhc-apks/apks/com.google.android.youtube/com.google.android.youtube-21.30.216-all.apk" \
            -o stock-youtube.apk
          echo "3775a15129dcc4e5b80fc17b7e0841b7fdd1ca89a6e72baa798806f666c74d02  stock-youtube.apk" | sha256sum -c -
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs stock-youtube.apk | tee stock-signature.txt
          grep -qi '3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a' stock-signature.txt
          "$AAPT" dump badging stock-youtube.apk | head -1 | tee stock-package-info.txt
          grep -q "com.google.android.youtube" stock-package-info.txt
          grep -q "21.30.216" stock-package-info.txt
      - name: Download released Morphe CLI
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 \
            "https://github.com/MorpheApp/morphe-desktop/releases/download/v2.2.0/morphe-desktop-2.2.0-all.jar" \
            -o morphe-desktop.jar
          echo "5ca0320ee05481df1ae3afd2f003bba3ff994d11d1f66ae48811ced71355e4fe  morphe-desktop.jar" | sha256sum -c -
          java -jar morphe-desktop.jar --help >/dev/null
      - name: Prepare adaptive VYRA launcher icon
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          source = Image.open("vyra-source/branding/assets/vyra-glass-monogram-256.webp").convert("RGB")
          logo = Image.new("RGBA", source.size)
          logo.putdata([(230, 234, 242, max(r, g, b)) for r, g, b in source.getdata()])
          densities = {
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }
          for folder, size in densities.items():
              target = Path("vyra-icon") / folder
              target.mkdir(parents=True, exist_ok=True)
              background = Image.new("RGBA", (size, size), (5, 5, 6, 255))
              draw = ImageDraw.Draw(background)
              inset = round(size * 0.09)
              draw.ellipse((inset, inset, size-inset, size-inset),
                           outline=(115, 122, 136, 135), width=max(1, size // 90))
              background.save(target / "morphe_adaptive_background_custom.png")
              foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              mark = logo.resize((round(size * 0.72), round(size * 0.72)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(mark, ((size-mark.width)//2, (size-mark.height)//2))
              foreground.save(target / "morphe_adaptive_foreground_custom.png")
          PY
      - name: Inspect compatible patch options
        run: |
          PATCHES="$(find dist/patches -name '*.mpp' -print -quit)"
          test -n "$PATCHES"
          java -jar morphe-desktop.jar list-patches --patches "$PATCHES" -f com.google.android.youtube --with-options | tee patch-list.txt
      - name: Patch and sign VYRA YouTube
        run: |
          PATCHES="$(find dist/patches -name '*.mpp' -print -quit)"
          java -jar morphe-desktop.jar patch \
            --patches "$PATCHES" \
            --enable "Clone app" \
            --options "packageName=app.vyra.youtube" \
            --options "updatePermissions=true" \
            --options "updateProviders=true" \
            --enable "Custom branding" \
            --options "customName=VYRA YouTube" \
            --options "customIcon=$GITHUB_WORKSPACE/vyra-icon" \
            --options "appIcon=Custom" \
            --signer "VYRA Project" \
            --out "VYRA-YouTube-21.30.216.apk" \
            --striplibs arm64-v8a \
            --result-file "patch-result.json" \
            "stock-youtube.apk"
          jq -e '.success == true and (.failedPatches | length) == 0' patch-result.json >/dev/null
          test -s "VYRA-YouTube-21.30.216.apk"
      - name: Verify APK signature and package
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "VYRA-YouTube-21.30.216.apk" | tee output-signature.txt
          grep -qi "7cdb3134b740c64fd37628a8b9f8fbf5aef6e65267719098741a5ff858c94d92" output-signature.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "VYRA-YouTube-21.30.216.apk" | tee package-info.txt
          grep -q "name='app.vyra.youtube'" package-info.txt
          grep -q "application-label:'VYRA YouTube'" package-info.txt
      - name: Prepare signed VYRA delivery
        run: |
          zip -j vyra-youtube-signed-delivery.zip \
            "VYRA-YouTube-21.30.216.apk" \
            patch-result.json package-info.txt patch-list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-youtube-signed-apk
          path: |
            VYRA-YouTube-21.30.216.apk
            vyra-youtube-signed-delivery.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [validate-overlay, build-mpp, build-apk]
    if: github.event_name == 'push' && needs.validate-overlay.result == 'success' && needs.build-mpp.result == 'success' && needs.build-apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vyra-youtube-signed-apk
          path: dist
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}
      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK="dist/VYRA-YouTube-21.30.216.apk"
          test -s "$APK"
          gh release create "vyra-build-$BUILD_NUMBER" "$APK#VYRA YouTube APK" \\
            --title "VYRA YouTube build $BUILD_NUMBER" \\
            --notes "Signed VYRA YouTube APK. Build number: $BUILD_NUMBER."
      - name: Publish verified update manifest
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK="dist/VYRA-YouTube-21.30.216.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/vyra-build-$BUILD_NUMBER/VYRA-YouTube-21.30.216.apk"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > updater/update-manifest.json <<EOF
          {
            "version": "21.30.216+vyra.$BUILD_NUMBER",
            "build_number": $BUILD_NUMBER,
            "package_name": "app.vyra.youtube",
            "apk_url": "$APK_URL",
            "sha256": "$SHA256",
            "size_bytes": $SIZE,
            "published_at": "$PUBLISHED_AT",
            "release_notes": "VYRA YouTube build $BUILD_NUMBER"
          }
          EOF
          printf '{ "status": "published", "message": "Yeni VYRA sürümü yayınlandı." }\\n' > updater/update-status.json
          python3 -m json.tool updater/update-manifest.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add updater/update-manifest.json updater/update-status.json
          git commit -m "Publish VYRA YouTube update manifest [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

  publish-status:
    needs: [validate-overlay, build-mpp, build-apk, publish-release]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}
      - name: Publish final build status
        env:
          VALIDATION_RESULT: ${{ needs.validate-overlay.result }}
          BUILD_RESULT: ${{ needs.build-mpp.result }}
          APK_RESULT: ${{ needs.build-apk.result }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VALIDATION_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ]; then RESULT=success; else RESULT=failure; fi
          if [ "$RESULT" = "success" ] && [ "$APK_RESULT" != "success" ]; then RESULT=failure; fi
          printf '{"run_id":%s,"status":"%s","validation":"%s","build":"%s","apk":"%s","url":"%s","commit":"%s"}\n' "$BUILD_RUN_ID" "$RESULT" "$VALIDATION_RESULT" "$BUILD_RESULT" "$APK_RESULT" "$BUILD_RUN_URL" "$GITHUB_SHA" > build-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add build-status.json
          git commit -m "Record VYRA patch build status [skip ci]" || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
