<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>VYRA Updater</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050506;color:#fff;font-family:Inter,system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#24262c,#09090c 55%,#050506)}.glow{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(65px);background:#9da5b7;opacity:.18;animation:float 9s ease-in-out infinite alternate}.panel{width:min(92vw,420px);text-align:center;padding:28px 22px;z-index:1}.orb{width:min(70vw,270px);aspect-ratio:1;margin:0 auto 30px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 35% 25%,#ffffff22,#ffffff05 65%,#0008);box-shadow:inset 0 2px 2px #fff8,inset 0 -20px 35px #fff1,0 25px 65px #000;border:1px solid #ffffff55}.orb:before{content:"";position:absolute;inset:13px;border-radius:50%;border:3px solid #ffffff18;border-top-color:#fff;border-right-color:#ffffff99;transform:rotate(var(--angle,0deg));transition:transform .25s linear}.percent{font-size:54px;font-weight:300;letter-spacing:-3px}.percent small{font-size:18px;letter-spacing:0;color:#aaa}.brand{letter-spacing:.42em;font-size:12px;color:#aaa;margin:0 0 12px}.headline{font-size:19px;font-weight:500;margin:0 0 9px}.detail{font-size:13px;color:#92949b;min-height:36px;line-height:1.5}.track{height:3px;background:#ffffff1c;border-radius:9px;margin:20px 4px 9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#888,#fff);box-shadow:0 0 12px #fff8;transition:width .2s}.meta{display:flex;justify-content:space-between;color:#777;font-size:11px}.install{margin-top:25px;width:100%;padding:15px;border-radius:15px;border:1px solid #ffffff38;background:linear-gradient(145deg,#ffffff20,#ffffff08);color:white;font-size:14px;font-weight:600}.install:disabled{opacity:.35}.foot{font-size:10px;color:#555;margin-top:18px}
</style></head><body><div class="glow"></div><main class="panel"><div class="orb" id="orb"><div class="percent"><span id="pct">0</span><small>%</small></div></div><p class="brand">V Y R A</p><h1 class="headline" id="headline">Güncelleme kontrol ediliyor</h1><p class="detail" id="detail">Güvenli bağlantı hazırlanıyor…</p><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span id="size">Bekleniyor</span><span id="speed">—</span></div><button class="install" id="install" disabled>Güncellemeyi yükle</button><p class="foot">VYRA • LIQUID GLASS UPDATE</p></main>
<script>
(()=>{const $=id=>document.getElementById(id);let ready=false;window.VYRAUpdater={
setProgress(done,total,bps){const p=total>0?Math.max(0,Math.min(100,done/total*100)):0;$('pct').textContent=Math.floor(p);$('fill').style.width=p+'%';$('orb').style.setProperty('--angle',(p*3.6)+'deg');$('size').textContent=total>0?(done/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB':'İndiriliyor';$('speed').textContent=bps>0?(bps/1048576).toFixed(2)+' MB/sn':'—';$('headline').textContent='Güncelleme indiriliyor';$('detail').textContent='Lütfen uygulamayı kapatmayın.'},
setReady(){ready=true;$('pct').textContent='100';$('fill').style.width='100%';$('headline').textContent='İndirme tamamlandı';$('detail').textContent='Dosya doğrulandı. Kuruluma geçebilirsin.';$('size').textContent='Doğrulandı';$('speed').textContent='';$('install').disabled=false},
setStatus(a,b){$('headline').textContent=a;$('detail').textContent=b||''},
setPaused(){$('headline').textContent='İndirme duraklatıldı'},
setError(m){$('headline').textContent='Bir sorun oluştu';$('detail').textContent=m;$('install').disabled=true}
};$('install').addEventListener('click',()=>{if(ready&&window.VYRAInstaller)window.VYRAInstaller.installUpdate()})})();
</script></body></html>
